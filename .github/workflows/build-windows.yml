name: Build and Release Windows App

on:
  push:
    paths:
      - 'windows/**'
      - 'Resources/ThirdPartyNotices.txt'
      - '.github/workflows/build-windows.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run service regression tests
        run: dotnet run --project windows/tests/ServiceTests/ServiceTests.csproj -c Release

      - name: Run desktop regression tests
        run: dotnet run --project windows/tests/DesktopTests/DesktopTests.csproj -c Release

      - name: Publish and package Windows x64
        shell: pwsh
        run: ./windows/build-windows.ps1 -Runtime win-x64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIQuotaMonitor-Windows-x64
          path: |
            dist/AIQuotaMonitor-*-windows-x64.zip
            dist/AIQuotaMonitor-*-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AIQuotaMonitor-*-windows-x64.zip
            dist/AIQuotaMonitor-*-windows-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
